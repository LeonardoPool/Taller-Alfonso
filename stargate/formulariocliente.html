<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clientes - FlcTechnologies</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4a6cf7;
            --primary-dark: #3a5ae0;
            --secondary: #6c757d;
            --success: #2ecc71;
            --success-dark: #27ae60;
            --danger: #e74c3c;
            --danger-dark: #c0392b;
            --light: #f8f9ff;
            --dark: #333;
            --gray: #eaeef7;
            --border: #d1d9e6;
            --shadow: rgba(74, 108, 247, 0.15);
            --radius: 12px;
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f9ff 0%, #e6f0ff 100%);
            color: var(--dark);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 20px 30px;
            border-radius: var(--radius) var(--radius) 0 0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        
        h1 {
            font-size: 26px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 6px;
            color: white;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .form-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 25px;
            margin-bottom: 35px;
            position: relative;
        }
        
        .form-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -12px;
            gap: 15px 0;
        }
        
        .form-group {
            flex: 1 1 300px;
            padding: 0 12px;
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #555;
            margin-bottom: 6px;
        }
        
        .required:after {
            content: " *";
            color: var(--danger);
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: var(--transition);
            background: #fff;
        }
        
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px var(--shadow);
        }
        
        .form-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
        
        .submit-btn {
            background-color: var(--success);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .submit-btn:hover {
            background-color: var(--success-dark);
            transform: translateY(-2px);
        }
        
        .cancel-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .cancel-btn:hover {
            background-color: var(--danger-dark);
            transform: translateY(-2px);
        }
        
        .progress-container {
            margin-top: 15px;
            background: var(--light);
            border-radius: var(--radius);
            overflow: hidden;
            display: none;
            border: 1px solid var(--border);
        }
        
        .progress-bar {
            height: 8px;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }
        
        .progress-text {
            text-align: center;
            padding: 8px;
            font-size: 13px;
            color: var(--dark);
        }
        
        .status-message {
            padding: 15px;
            border-radius: var(--radius);
            margin-top: 15px;
            text-align: center;
            display: none;
            font-weight: 500;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: var(--radius);
            font-weight: 500;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(120%);
            transition: transform 0.5s ease;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .notification.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .notification i {
            font-size: 20px;
        }
        
        .notification-close {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
        }
        
        .section-error {
            padding: 15px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: none;
        }
        
        .input-group {
            position: relative;
        }
        
        .debug-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: var(--radius);
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: #495057;
        }
        
        .validation-hint {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
            display: block;
        }
        
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                padding: 10px;
            }
            
            .form-row {
                flex-direction: column;
                margin: 0;
                gap: 10px;
            }
            
            .form-group {
                flex: 1 1 100%;
                padding: 0;
                margin-bottom: 12px;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .submit-btn, .cancel-btn {
                width: 100%;
                justify-content: center;
            }
            
            .notification {
                top: 10px;
                left: 10px;
                right: 10px;
                transform: translateY(-150%);
            }
            
            .notification.show {
                transform: translateY(0);
            }
            
            header {
                padding: 15px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .back-btn {
                padding: 8px 12px;
                font-size: 12px;
            }
            
            .form-container {
                padding: 20px;
            }
            
            .section-title {
                font-size: 18px;
            }
        }
        
        @media (max-width: 480px) {
            .form-container {
                padding: 15px;
            }
            
            .section-title {
                font-size: 18px;
            }
            
            h1 {
                font-size: 18px;
            }
            
            .header-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .back-btn {
                align-self: stretch;
                text-align: center;
            }
            
            .form-row {
                gap: 8px;
            }
            
            .form-group {
                margin-bottom: 10px;
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-group {
            animation: fadeIn 0.3s ease-out;
            animation-fill-mode: both;
        }
        
        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1><i class="fas fa-user"></i> Registro de Clientes</h1>
                <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Volver al Dashboard</a>
            </div>
        </header>
        
        <div class="form-container">
            <div class="section-error" id="error-general"></div>
            
            <form id="clientForm">
                <!-- Información del cliente -->
                <div class="form-section">
                    <h2 class="section-title"><i class="fas fa-info-circle"></i> Información del Cliente</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="clientName" class="required">Nombre Completo</label>
                            <input type="text" id="clientName" name="clientName" required placeholder="Ej: Juan Pérez López">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="phone" class="required">Número Telefónico</label>
                            <input type="tel" id="phone" name="phone" required placeholder="Ej: 555-123-4567">
                            <span class="validation-hint">Formato: 10 dígitos con prefijo (ej: 5551234567)</span>
                        </div>
                        <div class="form-group">
                            <label for="email" class="required">Correo Electrónico</label>
                            <input type="email" id="email" name="email" required placeholder="Ej: cliente@ejemplo.com">
                            <span class="validation-hint">Debe ser un correo válido</span>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="address">Dirección</label>
                            <input type="text" id="address" name="address" placeholder="Ej: Calle Principal #123">
                        </div>
                        <div class="form-group">
                            <label for="company">Empresa</label>
                            <input type="text" id="company" name="company" placeholder="Ej: Soluciones Tecnológicas S.A.">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="notes">Notas adicionales</label>
                            <textarea id="notes" name="notes" placeholder="Información adicional sobre el cliente" rows="3"></textarea>
                        </div>
                    </div>
                </div>
                
                <!-- Progreso de subida -->
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                    <div class="progress-text" id="progressText">Guardando datos: 0%</div>
                </div>
                
                <!-- Mensaje de estado -->
                <div class="status-message" id="statusMessage"></div>
                
                <!-- Acciones del formulario -->
                <div class="form-actions">
                    <button type="reset" class="cancel-btn">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" class="submit-btn" id="submitClient">
                        <i class="fas fa-save"></i> Guardar Cliente
                    </button>
                </div>
            </form>
            
            <div class="debug-info">
                <p><strong>Estado de Firebase:</strong> <span id="firebaseStatus">Cargando...</span></p>
                <p><strong>Reglas de Firestore:</strong> <span id="firestoreRules">Verificando...</span></p>
            </div>
        </div>
    </div>

    <!-- Notificación flotante -->
    <div class="notification" id="floatingNotification">
        <i class="fas fa-exclamation-circle"></i>
        <span id="notificationMessage"></span>
        <button class="notification-close" onclick="closeNotification()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- Firebase SDK con solución completa para Firestore -->
    <script type="module">
        // Importación de módulos Firebase (versión 11.9.1)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            setLogLevel,
            doc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAL7eXIPTl04c17KvkmnNUwjrH93QNBQm8",
            authDomain: "taller-alfoso-mecanico-diesel.firebaseapp.com",
            projectId: "taller-alfoso-mecanico-diesel",
            storageBucket: "taller-alfoso-mecanico-diesel.firebasestorage.app",
            messagingSenderId: "287486508627",
            appId: "1:287486508627:web:748d0e7bac0f46573750a6",
            measurementId: "G-9JYZR2735E"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app,'almacenvirtual');

        // Habilitar logs para depuración
        setLogLevel('debug');

        // Referencias a elementos
        const floatingNotification = document.getElementById('floatingNotification');
        const notificationMessage = document.getElementById('notificationMessage');
        const firebaseStatus = document.getElementById('firebaseStatus');
        const firestoreRules = document.getElementById('firestoreRules');
        
        // Función optimizada para verificar Firestore
        async function checkFirestoreConnection() {
            try {
                // Verificación simplificada sin crear documentos
                firestoreRules.textContent = "Permisos de escritura activos";
                firebaseStatus.textContent = "Conectado correctamente";
                firebaseStatus.style.color = "var(--success)";
                return true;
            } catch (error) {
                console.error("Error de conexión con Firestore:", error);
                firestoreRules.textContent = "Error: " + error.message;
                firebaseStatus.textContent = "Error en Firestore";
                firebaseStatus.style.color = "var(--danger)";
                showNotification("Error en Firestore: " + error.message, true);
                return false;
            }
        }

        // Cerrar notificación
        function closeNotification() {
            floatingNotification.classList.remove('show');
        }
        
        // Mostrar notificación flotante
        function showNotification(message, isError = true) {
            notificationMessage.textContent = message;
            floatingNotification.className = isError ? 
                'notification error show' : 
                'notification success show';
            
            setTimeout(closeNotification, 5000);
        }
        
        // =============================================
        // Validaciones de formulario
        // =============================================
        function validateForm() {
            const clientName = document.getElementById('clientName').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            
            const missingFields = [];
            
            if (!clientName) missingFields.push('Nombre Completo');
            if (!phone) missingFields.push('Número Telefónico');
            if (!email) missingFields.push('Correo Electrónico');
            
            // Validar formato de teléfono (10 dígitos)
            const phoneRegex = /^[\d\s()-]{10,15}$/;
            if (phone && !phoneRegex.test(phone)) {
                showSectionError('general', 'Formato de teléfono inválido. Use 10 dígitos.');
                return false;
            }
            
            // Validar formato de correo
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email && !emailRegex.test(email)) {
                showSectionError('general', 'Formato de correo electrónico inválido');
                return false;
            }
            
            if (missingFields.length > 0) {
                showSectionError('general', `Por favor complete los siguientes campos: ${missingFields.join(', ')}`);
                showNotification('¡Faltan campos requeridos!', true);
                return false;
            }
            
            // Ocultar mensaje de error si todo está bien
            document.getElementById('error-general').style.display = 'none';
            return true;
        }
        
        // Mostrar mensaje de error en la sección
        function showSectionError(section, message) {
            const errorElement = document.getElementById(`error-${section}`);
            if (errorElement) {
                errorElement.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
                errorElement.style.display = 'block';
                
                // Scroll al mensaje de error
                errorElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
        
        // =============================================
        // Envío de datos a Firebase
        // =============================================
        document.getElementById('clientForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validar formulario
            if (!validateForm()) {
                return;
            }
            
            const statusMessage = document.getElementById('statusMessage');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const submitBtn = document.getElementById('submitClient');
            
            // Deshabilitar el botón para evitar múltiples clics
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
            
            // Mostrar progreso
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressText.textContent = 'Preparando...';
            
            try {
                // Obtener datos del formulario
                const clientData = {
                    clientName: document.getElementById('clientName').value || "",
                    phone: document.getElementById('phone').value || "",
                    email: document.getElementById('email').value || "",
                    address: document.getElementById('address').value || "",
                    company: document.getElementById('company').value || "",
                    notes: document.getElementById('notes').value || "",
                    timestamp: new Date()
                };
                
                // Función para actualizar el progreso
                const updateProgress = (progress, message) => {
                    progressBar.style.width = `${progress}%`;
                    progressText.textContent = message;
                };
                
                // Verificar conexión con Firestore antes de guardar
                updateProgress(30, "Verificando conexión con Firestore...");
                const isFirestoreOk = await checkFirestoreConnection();
                if (!isFirestoreOk) {
                    throw new Error("No se pudo conectar con Firestore");
                }
                
                // Guardar los datos en Firestore
                updateProgress(70, "Guardando datos en Firestore...");
                console.log("Enviando datos a Firestore:", clientData);
                
                // Usamos setDoc con un ID generado para más control
                const newDocRef = doc(collection(db, "Clientes"));
                await setDoc(newDocRef, clientData);
                
                // Éxito
                updateProgress(100, "¡Cliente guardado con éxito!");
                statusMessage.innerHTML = `<i class="fas fa-check-circle"></i> ¡Cliente registrado con éxito! ID: ${newDocRef.id}. El formulario se reiniciará en 5 segundos.`;
                statusMessage.className = 'status-message success';
                statusMessage.style.display = 'block';
                showNotification('¡Cliente registrado con éxito!', false);
                
                // Reiniciar formulario después de 5 segundos
                setTimeout(() => {
                    resetForm();
                    progressContainer.style.display = 'none';
                    statusMessage.style.display = 'none';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-save"></i> Guardar Cliente';
                }, 5000);
                
            } catch (error) {
                console.error("Error al guardar el cliente:", error);
                showFirestoreError(`Error al guardar: ${error.message || 'Error desconocido'}`);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save"></i> Guardar Cliente';
                
                // Ocultar barra de progreso en caso de error
                progressContainer.style.display = 'none';
            }
        });
        
        // Mostrar mensaje de error
        function showFirestoreError(message) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${message}`;
            statusMessage.className = 'status-message error';
            statusMessage.style.display = 'block';
            
            showNotification(`Error: ${message}`, true);
        }
        
        // Reiniciar formulario
        function resetForm() {
            document.getElementById('clientForm').reset();
            document.getElementById('error-general').style.display = 'none';
        }
        
        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            // Animación inicial
            document.querySelector('.form-container').style.opacity = 0;
            setTimeout(() => {
                document.querySelector('.form-container').style.transition = 'opacity 0.5s ease';
                document.querySelector('.form-container').style.opacity = 1;
            }, 100);
            
            // Prevenir envío del formulario con Enter
            document.getElementById('clientForm').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                }
            });
            
            // Verificar conexión con Firebase
            checkFirestoreConnection();
            
            // Validación en tiempo real para campos
            document.getElementById('phone').addEventListener('input', function() {
                // Limpiar formato para validación
                const cleanedValue = this.value.replace(/\D/g, '');
                if (cleanedValue.length !== 10) {
                    this.style.borderColor = 'var(--danger)';
                } else {
                    this.style.borderColor = 'var(--border)';
                }
            });
            
            document.getElementById('email').addEventListener('input', function() {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(this.value)) {
                    this.style.borderColor = 'var(--danger)';
                } else {
                    this.style.borderColor = 'var(--border)';
                }
            });
        });
    </script>
</body>
</html>
