<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WYLEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <!-- Success message -->
    <div class="success-message" id="successMessage">¡Login exitoso! Redirigiendo...</div>

    <!-- Split Layout -->
    <div class="auth-layout">
        <section class="form-side">
            <div class="login-container">
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true"></span>
                    <span class="brand-text">Taller Alfonso</span>
                </div>
                <h1 class="login-title">Iniciar Sesión</h1>

                <div class="input-group">
                    <label class="input-label" for="email">Correo electrónico</label>
                    <input type="email" class="input-field" id="email" placeholder="tucorreo@ejemplo.com"
                        autocomplete="email" required>
                    <div class="error-message" id="emailError">Por favor ingresa un email válido</div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="password">Contraseña</label>
                    <a href="#" class="forgot-password">Olvidé mi contraseña</a>
                    <input type="password" class="input-field" id="password" placeholder="••••••••"
                        autocomplete="current-password" required>
                    <div class="error-message" id="passwordError">La contraseña debe tener al menos 6 caracteres</div>
                </div>

                <div class="remember-wrap">
                    <input type="checkbox" id="rememberCheck" aria-label="Recordarme">
                    <label for="rememberCheck">Recuérdame</label>
                </div>

                <button class="login-button" id="loginButton" type="button">Iniciar Sesión</button>

                <div class="divider"></div>

                <a href="#" class="spanish-login">¿No tienes una cuenta? Regístrate</a>

                <p class="powered-by">Powered by WYLEN TECHNOLOGIES LLC a Leonardo Pool Linares brand</p>
            </div>
        </section>
        <aside class="media-side" aria-hidden="true">
            <video class="video-bg" src="source/newlogin.mp4" autoplay loop muted playsinline preload="metadata"
                poster="source/logo.jpg"></video>
            <div class="media-gradient"></div>
        </aside>
    </div>

    <!-- Módulo de JavaScript -->
    <script type="module" src="js/login.js"></script>
</body>

</html>
