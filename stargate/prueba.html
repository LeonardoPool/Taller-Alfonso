<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prueba Firebase</title>
</head>
<body>
  <h1>Prueba Firestore</h1>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAL7eXIPTl04c17KvkmnNUwjrH93QNBQm8",
      authDomain: "taller-alfoso-mecanico-diesel.firebaseapp.com",
      projectId: "taller-alfoso-mecanico-diesel"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    getDocs(collection(db, "Clientes"))
      .then(snapshot => console.log("Docs encontrados:", snapshot.size))
      .catch(err => console.error("Error al obtener documentos:", err));
  </script>
</body>
</html>
