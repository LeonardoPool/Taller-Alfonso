<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DEFCON5 Empleados">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png">
    <title>Acceso Mecánicos - DEFCON 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/design-tokens.css?v=2.8">
    <link rel="stylesheet" href="css/login.css?v=2.8">
</head>
<body>
    <!-- Firebase Loading -->
    <div class="firebase-loading" id="firebaseLoading">
        <div class="truck-wrapper">
            <div class="road"></div>
            <div class="truck">
                <div class="truck-cabin"></div>
                <div class="wheel wheel-front"></div>
                <div class="wheel wheel-back"></div>
                <div class="truck-light"></div>
                <div class="smoke"></div>
            </div>
        </div>
        <p class="loading-text">Cargando mecánicos...</p>
        <p class="loading-subtext">Por favor espere mientras configuramos su entorno</p>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
    </div>
    
    <!-- Background animation - Hexágonos -->
    <div class="background-animation" id="backgroundAnimation"></div>
    
    <!-- Success message -->
    <div class="success-message" id="successMessage">¡Acceso concedido! Redirigiendo...</div>
    
    <!-- Login Container -->
    <div class="login-container">
        <h1 class="login-title">ACCESO MECÁNICOS</h1>
        
        <div class="input-group">
            <label class="input-label">Seleccionar Mecánico</label>
            <select class="select-field" id="mechanicSelect">
                <option value="" disabled selected>Selecciona tu nombre</option>
                <!-- Las opciones se cargarán dinámicamente -->
            </select>
            <div class="error-message" id="selectError">Por favor selecciona tu nombre</div>
        </div>
        
        <div class="input-group">
            <label class="input-label">PIN</label>
            <div class="pin-input-container">
                <input type="password" class="input-field" id="pin" placeholder="Ingresa tu PIN" maxlength="4">
                <i class="toggle-pin fas fa-eye" id="togglePin"></i>
            </div>
            <div class="error-message" id="pinError">El PIN debe tener 4 dígitos</div>
        </div>
        
        <a href="#" class="forgot-password">¿Problemas con tu PIN?</a>
        
        <button class="login-button" id="loginButton">Acceder</button>
        
        <p class="powered-by">Desarrollado por FleTechnologies M.R. LLC a Leonardo Linares brand</p>
    </div>

    
    <script type="module" src="js/login.js?v=2.8"></script>
    <script type="module" src="js/pwa-manager.js?v=2.8"></script>
</body>
</html>
